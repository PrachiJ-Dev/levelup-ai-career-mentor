services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: levelup-backend:dev
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - JWT_SECRET=${JWT_SECRET}
      - DEMO_MODE=true
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - redis
    networks:
      - levelup-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: levelup-frontend:dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - levelup-net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - levelup-net

networks:
  levelup-net:
    driver: bridge
